specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Radar
providerId: radar-io
created: '2026-07-01'
modified: '2026-07-01'
reconciled: false
tags:
- Location
- Geocoding
- Geofencing
- Maps
- Routing
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Radar spend. Radar bills a Free monthly allotment of API calls
  and tracked users, then usage-based overages on API requests and per tracked
  user, with volume-committed Enterprise agreements. Cost drivers are per-request
  metering across geocoding, search, routing, and address validation, and per
  tracked user across the Track / SDK surfaces.
notes: >-
  Per-product allotments and overage rates are subject to change; verify against
  the Radar pricing page during reconciliation.
sources:
- https://radar.com/pricing
- https://radar.com/documentation
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Radar
serviceCategory: Location and Mapping
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Radar
  ServiceCategory: Location and Mapping
  ProviderName: Radar
  PublisherName: Radar
  InvoiceIssuerName: Radar
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: api_calls
  description: Billable API requests across geocoding, search, routing, and address validation, metered per call above the plan allotment.
  unit: requests
  aggregation: sum
  dimensions:
  - organization
  - product
  - key_type
- name: tracked_users
  description: Monthly unique tracked users (devices) via the Track / SDK surfaces.
  unit: users
  aggregation: unique
  dimensions:
  - organization
- name: tile_requests
  description: Raster and vector map tile requests served by z/x/y.
  unit: requests
  aggregation: sum
  dimensions:
  - organization
  - style
- name: matrix_elements
  description: Origin-by-destination elements computed by the distance matrix endpoint.
  unit: elements
  aggregation: sum
  dimensions:
  - organization
principles:
- name: Visibility
  description: Pull Radar dashboard usage; inspect per-product call volume and tracked-user counts.
- name: Allocation
  description: Segment publishable vs. secret keys per app/team and map to internal cost centers.
- name: Optimization
  description: Debounce autocomplete input, cache geocoding results, batch with the matrix endpoint, and stay within Free allotments where possible.
- name: Accountability
  description: Assign owners per project/key; review monthly API-call and tracked-user spend against budget.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
