aid: radar-io
url: https://raw.githubusercontent.com/api-evangelist/radar-io/refs/heads/main/apis.yml
name: Radar
kind: company
description: Radar is a geofencing and maps platform that gives developers a unified
  location infrastructure - forward and reverse geocoding, IP geocoding, address and
  place autocomplete, place and geofence search, routing (distance, matrix, directions,
  and route matching), geofence management, device tracking, events, trips, address
  verification, and map tiles - all under a single api.radar.io/v1 REST interface.
