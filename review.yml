    type: APIReference
    note: All documented endpoints are HTTPS REST under api.radar.io/v1.
  - url: https://radar.com/documentation
    type: Documentation
    note: Platform overview; describes SDKs and webhooks, no WebSocket surface.
  - url: https://radar.com/documentation/api#webhooks
    type: Documentation
    note: Realtime events are delivered as outbound HTTP webhooks, not WebSocket.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists and event delivery is via HTTP
    webhooks rather than a message-driven streaming transport, so no AsyncAPI
    document was created. The apis.yml catalogs the documented REST surfaces
    only.
