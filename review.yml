aid: radar-io
name: Radar
review:
  question: Does Radar expose a documented public WebSocket API?
  answer: false
  date: '2026-07-01'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Radar's public platform is a REST
    (HTTPS) API under https://api.radar.io/v1. Realtime location updates in
    Radar are delivered as server-to-server webhooks (HTTP callbacks) and via
    the mobile SDKs, not as a documented WebSocket or HTTP streaming surface,
    so there is no message-driven transport to model.
findings:
  summary: |
    Radar does not publish a documented public WebSocket API. The Radar API is
    a request/response REST (HTTPS) API under https://api.radar.io/v1,
    authenticated with a publishable (prj_..._pk_...) or secret (prj_..._sk_...)
    key in the Authorization header. Realtime geofence, place, and trip events
    are pushed to customer endpoints via HTTP webhooks, and captured on-device
    by the Radar SDKs; neither is a WebSocket (ws:// or wss://) surface. No
    bidirectional streaming endpoint is documented.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.radar.io/v1
      documented: true
    - protocol: Webhooks
      scheme: https
      note: Event notifications are delivered as outbound HTTP POST callbacks to a customer-configured URL. Not WebSocket.
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in the Radar API reference as of the review date.
  endpointsConfirmedRest:
